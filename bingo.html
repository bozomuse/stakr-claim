<title>cookout bingo — your card</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #faf3e7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 20px;
    background: #170d09; }
  h1 { font-size: clamp(28px, 6vw, 48px); margin-bottom: 8px; text-align: center; }
  p.sub { opacity: .7; margin-bottom: 24px; text-align: center; max-width: 500px; }
  .lookup { display: flex; gap: 8px; margin-bottom: 24px; width: 100%; max-width: 400px; }
  .lookup input { flex: 1; padding: 12px 16px; font-size: 18px; border: 2px solid #e8a020; border-radius: 8px; background: #2a2a2a; color: #faf3e7; }
  .lookup button { padding: 12px 24px; font-size: 18px; font-weight: bold; background: #c8342a; color: #faf3e7; border: none; border-radius: 8px; cursor: pointer; }
  .lookup button:hover { background: #e04a3a; }
  #card-wrap { width: 100%; max-width: 600px; display: none; }
  #card-wrap.show { display: block; }
  #card-img { width: 100%; height: auto; border-radius: 12px; border: 3px solid #e8a020; }
  #card-name { text-align: center; margin-top: 12px; font-size: 20px; font-weight: bold; }
  #error { color: #e04a3a; margin-top: 12px; display: none; }
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .scene svg { width: 100%; height: 100%; display: block; }
  @keyframes smokeRise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .45; } 100% { transform: translateY(-110px); opacity: 0; } }
  .smoke { animation: smokeRise 7s ease-in-out infinite; }
  .smoke.s2 { animation-delay: -2.4s; } .smoke.s3 { animation-delay: -4.8s; }
  @keyframes twinkle { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .bulbs use { animation: twinkle 2.8s ease-in-out infinite; }
  @keyframes emberFloat { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(26px,-170px); opacity: 0; } }
  .ember { animation: emberFloat 9s linear infinite; }
  @keyframes coalGlow { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  .coals { animation: coalGlow 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
  body > :not(.scene) { position: relative; z-index: 1; }
</style>
</head>

</div>
  <h1>🍗 cookout bingo</h1>
  <p class="sub">bankr won't show your card image, so look it up here. enter your bingo pass token id.</p>
  <div class="lookup">
    <input id="token-id" type="number" min="1" placeholder="token id" inputmode="numeric">
    <button onclick="showCard()">show my card</button>
  </div>
  <div id="error"></div>
  <div id="card-wrap">
    <img id="card-img" alt="bingo card">
    <div id="card-name"></div>
  </div>
<script>
  function showCard() {
    const id = document.getElementById('token-id').value.trim();
    const err = document.getElementById('error');
    const wrap = document.getElementById('card-wrap');
    err.style.display = 'none';
    wrap.classList.remove('show');
    if (!id || id < 1) { err.textContent = 'enter a valid token id.'; err.style.display = 'block'; return; }
    const img = document.getElementById('card-img');
    img.onerror = () => { err.textContent = 'no card found for token ' + id + ' yet.'; err.style.display = 'block'; };
    img.onload = () => { wrap.classList.add('show'); };
    img.src = 'bingo/cards/' + id + '.png?v=2';
    document.getElementById('card-name').textContent = 'cookout bingo pass #' + id;
    history.replaceState(null, '', '?token=' + id);
  }
  // support ?token=4 deep links
  const params = new URLSearchParams(location.search);
  if (params.get('token')) {
    document.getElementById('token-id').value = params.get('token');
    showCard();
  }
  document.getElementById('token-id').addEventListener('keydown', e => { if (e.key === 'Enter') showCard(); });
</script>
</body>
